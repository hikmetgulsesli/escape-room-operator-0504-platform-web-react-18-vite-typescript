<!DOCTYPE html>

<html class="dark" lang="tr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Acil Durdur - COMMAND CENTER</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary": "#002e6a",
                        "on-surface": "#e1e2ec",
                        "error": "#ffb4ab",
                        "surface-container-lowest": "#0b0e15",
                        "on-secondary-fixed": "#111c2d",
                        "on-background": "#e1e2ec",
                        "tertiary-container": "#df7412",
                        "background": "#10131a",
                        "outline": "#8c909f",
                        "inverse-surface": "#e1e2ec",
                        "primary-fixed": "#d8e2ff",
                        "on-primary-fixed": "#001a42",
                        "surface-variant": "#32353c",
                        "on-secondary-fixed-variant": "#3c475a",
                        "on-primary-container": "#00285d",
                        "secondary": "#bcc7de",
                        "error-container": "#93000a",
                        "on-tertiary-fixed": "#311400",
                        "on-secondary-container": "#aeb9d0",
                        "tertiary": "#ffb786",
                        "inverse-on-surface": "#2e3038",
                        "on-error": "#690005",
                        "secondary-container": "#3e495d",
                        "on-tertiary": "#502400",
                        "on-error-container": "#ffdad6",
                        "on-tertiary-fixed-variant": "#723600",
                        "inverse-primary": "#005ac2",
                        "on-secondary": "#263143",
                        "outline-variant": "#424754",
                        "surface-dim": "#10131a",
                        "secondary-fixed": "#d8e3fb",
                        "primary": "#adc6ff",
                        "on-surface-variant": "#c2c6d6",
                        "primary-fixed-dim": "#adc6ff",
                        "primary-container": "#4d8eff",
                        "tertiary-fixed-dim": "#ffb786",
                        "surface-bright": "#363941",
                        "on-primary-fixed-variant": "#004395",
                        "tertiary-fixed": "#ffdcc6",
                        "surface-tint": "#adc6ff",
                        "surface-container-high": "#272a31",
                        "surface-container-low": "#191b23",
                        "surface-container": "#1d2027",
                        "on-tertiary-container": "#461f00",
                        "surface-container-highest": "#32353c",
                        "surface": "#10131a",
                        "secondary-fixed-dim": "#bcc7de"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "md": "16px",
                        "xl": "32px",
                        "xs": "4px",
                        "sm": "8px",
                        "gutter": "16px",
                        "base": "4px",
                        "lg": "24px",
                        "margin": "24px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Inter"],
                        "label-caps": ["Inter"],
                        "display-timer": ["Inter"],
                        "headline-md": ["Inter"],
                        "body-base": ["Inter"],
                        "body-sm": ["Inter"],
                        "mono-data": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg": ["24px", { "lineHeight": "1.2", "fontWeight": "600" }],
                        "label-caps": ["11px", { "lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "700" }],
                        "display-timer": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-md": ["18px", { "lineHeight": "1.4", "fontWeight": "600" }],
                        "body-base": ["14px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "body-sm": ["12px", { "lineHeight": "1.4", "fontWeight": "400" }],
                        "mono-data": ["13px", { "lineHeight": "1", "letterSpacing": "-0.01em", "fontWeight": "500" }]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background text-on-surface h-screen w-screen overflow-hidden font-body-base">
<!-- Intent implies a transactional/modal "Dead End" overlay for Emergency Stop.
         Supplying the Navigation Shells, but visually pushing them to background to focus on the modal canvas. -->
<!-- Background Canvas (Simulated Main Dashboard behind modal) -->
<div class="fixed inset-0 bg-surface-container-lowest z-0 flex flex-col blur-[2px] opacity-30 pointer-events-none">
<!-- TopNavBar Structure -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-6 h-14 bg-slate-900/80 backdrop-blur-md text-blue-500 dark:text-blue-400 font-inter tracking-tight text-sm border-b border-slate-700/50 flat no shadows">
<div class="flex items-center gap-4">
<span class="text-lg font-black tracking-tighter text-blue-500 uppercase">COMMAND CENTER</span>
</div>
<div class="flex items-center gap-4">
<button class="bg-red-500 text-white px-4 py-1.5 rounded text-xs font-bold tracking-wider hover:bg-slate-800/50 transition-colors">EMERGENCY STOP</button>
</div>
</header>
<!-- SideNavBar Structure -->
<nav class="fixed left-0 top-0 h-full w-64 border-r border-slate-800 bg-slate-900/90 backdrop-blur-lg text-blue-500 dark:text-blue-400 font-inter text-xs font-medium uppercase tracking-widest shadow-2xl flex flex-col pt-16 pb-6 px-4">
<div class="flex-1 space-y-2 mt-4">
<a class="flex items-center gap-3 px-3 py-2 rounded text-slate-500 hover:text-slate-300 hover:bg-slate-800/40" href="#">
<span class="material-symbols-outlined">dashboard</span>
                    Dashboard
                 </a>
</div>
</nav>
</div>
<!-- The Emergency Modal Overlay (Level 2 Elevation) -->
<div class="fixed inset-0 z-[100] flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
<!-- Modal Container -->
<div class="w-full max-w-2xl bg-surface border border-error-container rounded-lg shadow-[0_0_40px_rgba(239,68,68,0.2)] overflow-hidden flex flex-col animate-pulse" style="animation-duration: 3s;">
<!-- Modal Header (Warning) -->
<div class="bg-error-container/20 border-b border-error-container p-6 flex items-center justify-center gap-4">
<span class="material-symbols-outlined fill text-error text-[48px]">warning</span>
<h1 class="font-headline-lg text-error tracking-wider uppercase">TÜM SİSTEMLER DURDURULDU</h1>
<span class="material-symbols-outlined fill text-error text-[48px]">warning</span>
</div>
<!-- Modal Body -->
<div class="p-8 space-y-8 bg-[#1E293B] bg-opacity-80 backdrop-blur-md">
<!-- Status & Information Grid -->
<div class="grid grid-cols-2 gap-6">
<div class="bg-surface-container-high rounded border border-outline-variant p-4">
<p class="font-label-caps text-on-surface-variant mb-2">SİSTEM DURUMU</p>
<p class="font-headline-md text-error flex items-center gap-2">
<span class="w-3 h-3 rounded-full bg-error animate-ping"></span>
                            ACİL DURUM AKTİF
                        </p>
</div>
<div class="bg-surface-container-high rounded border border-outline-variant p-4">
<p class="font-label-caps text-on-surface-variant mb-2">GEÇEN SÜRE</p>
<p class="font-display-timer text-on-surface">00:01:42</p>
</div>
</div>
<!-- Simulation Controls (Ghost Buttons) -->
<div class="space-y-4">
<p class="font-label-caps text-on-surface-variant">SİMÜLASYON KONTROLLERİ</p>
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<button class="flex items-center justify-between p-4 rounded border border-[#334155] bg-[#1E293B]/50 hover:bg-[#1E293B] text-on-surface transition-colors group">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-tertiary">notifications_active</span>
<span class="font-body-base font-semibold">Tüm Sirenleri Sustur</span>
</div>
<span class="font-label-caps text-outline-variant group-hover:text-tertiary transition-colors">BEKLEMEDE</span>
</button>
<button class="flex items-center justify-between p-4 rounded border border-[#334155] bg-[#1E293B]/50 hover:bg-[#1E293B] text-on-surface transition-colors group">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary">lock_open</span>
<span class="font-body-base font-semibold">Tüm Kilitleri Aç</span>
</div>
<span class="font-label-caps text-primary">TAMAMLANDI</span>
</button>
</div>
</div>
<!-- Incident Log Entry -->
<div class="space-y-2">
<label class="font-label-caps text-on-surface-variant block" for="incident-log">OLAY GÜNLÜĞÜ NOTU (ZORUNLU)</label>
<textarea class="w-full bg-[#0F172A] border border-[#334155] rounded text-on-surface font-body-sm p-3 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary/50 transition-colors resize-none placeholder:text-outline-variant" id="incident-log" placeholder="Acil durum nedenini buraya giriniz... Olay günlüğüne otomatik kaydedilecektir." rows="3"></textarea>
</div>
</div>
<!-- Modal Footer (Confirmation & Recovery Action) -->
<div class="border-t border-[#334155] bg-surface-container p-6 flex flex-col md:flex-row items-center justify-between gap-6">
<!-- Safety Checkbox -->
<div class="flex items-center gap-3 w-full md:w-auto">
<input class="w-5 h-5 rounded border-[#334155] bg-[#0F172A] text-primary focus:ring-primary focus:ring-offset-[#10131a] accent-primary cursor-pointer" id="safety-confirm" type="checkbox"/>
<label class="font-body-sm text-on-surface-variant cursor-pointer select-none" for="safety-confirm">
                        Tesis güvenliğinin sağlandığını ve prosedürlerin tamamlandığını onaylıyorum.
                    </label>
</div>
<!-- Recovery Button -->
<button class="w-full md:w-auto px-8 py-3 rounded bg-surface-variant text-on-surface-variant font-headline-md tracking-wide disabled:opacity-50 disabled:cursor-not-allowed transition-colors border border-outline flex items-center justify-center gap-2" disabled="">
<span class="material-symbols-outlined">restart_alt</span>
                    Güvenli Duruma Dön
                </button>
</div>
</div>
</div>
</body></html>
